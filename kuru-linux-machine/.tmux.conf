# Prefix = F12, which Caps Lock sends via a system-wide hidutil remap
# (persisted by ~/Library/LaunchAgents/com.ritik.capslock-f12.plist).
# Tap Caps Lock, then the command key — e.g. Caps, c = new window.
unbind C-b
set -g prefix F12
bind F12 send-prefix

set -g mouse on

# Truecolor: apps inside tmux should see the same 24-bit color support as a plain tab.
# tmux-256color enables full tmux terminfo; the RGB feature flag tells tmux the outer
# terminal (Alacritty, reported as xterm-256color) can render 24-bit color, so tmux
# passes RGB escapes through instead of rounding them to the 256-color palette.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"

# ---------------------------------------------------------------
# Design
# ---------------------------------------------------------------

# Status bar on top, transparent background so it blends with the
# terminal theme instead of painting a solid colored strip.
set -g status-position top
set -g status-justify left
set -g status-style 'fg=#8a8a8a,bg=default'
set -g status-interval 5

# Left: session name in the accent color.
set -g status-left '#[fg=#87afff,bold] #S  '
set -g status-left-length 30

# Right: date and time, time emphasized.
set -g status-right '#[fg=#8a8a8a]%a %d %b  #[fg=#d0d0d0,bold]%H:%M '
set -g status-right-length 50

# Windows: inactive tabs get a subtle dark background; the current tab
# gets a bright accent background so it's obvious which one you're on.
# The zoom flag (#{?window_zoomed_flag,...}) shows a marker when a pane
# is zoomed, which is otherwise easy to forget.
setw -g window-status-format ' #I:#W '
setw -g window-status-style 'fg=#8a8a8a,bg=#303030'
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, ⛶,} '
setw -g window-status-current-style 'fg=#1c1c1c,bg=#87afff,bold'
setw -g window-status-separator ' '

# Highlight window names (no popup messages) when a background
# window has activity or rings a bell.
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style 'fg=#d7af5f'
setw -g window-status-bell-style 'fg=#d75f5f,bold'

# Panes: dim borders, accent on the active pane.
set -g pane-border-style 'fg=#3a3a3a'
set -g pane-active-border-style 'fg=#87afff'

# Command prompt / messages and copy-mode selection.
set -g message-style 'fg=#d0d0d0,bg=#303030,bold'
setw -g mode-style 'fg=#1c1c1c,bg=#87afff'
setw -g clock-mode-colour '#87afff'
